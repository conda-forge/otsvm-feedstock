context:
  version: "0.18"

package:
  name: otsvm
  version: ${{ version }}

source:
  url: https://github.com/openturns/otsvm/archive/v${{ version }}.tar.gz
  sha256: 2d154f3f420dec4df001dbbb588ee653e4feb34e61cafc9ac45b4dcafce07d19

build:
  number: 0
  python:
    version_independent: true

requirements:
  build:
    - cmake
    - swig
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - if: unix
      then: make
      else: ninja
    - if: win
      then: m2-diffutils
    - if: build_platform != target_platform
      then:
        - python-abi3 ${{ python_min }}.*
        - python ${{ python_min }}.*
        - cross-python_${{ target_platform }}
  host:
    - python-abi3 ${{ python_min }}.*
    - python ${{ python_min }}.*
    - openturns
  run:
    - python >=${{ python_min }}
  run_exports:
    - ${{ pin_subpackage('otsvm', upper_bound='x.x') }}

tests:
  - python:
      imports:
        - otsvm

about:
  homepage: http://openturns.org/
  license: LGPL-3.0-or-later
  license_family: LGPL
  license_file: COPYING.LESSER
  summary: SVM module
  documentation: https://openturns.github.io/otsvm/master/
  repository: https://github.com/openturns/otsvm

extra:
  recipe-maintainers:
    - jschueller
